apiVersion: kuberecord.io/v1alpha1
kind: StreamRule
metadata:
  name: team-payments-workloads
  namespace: default
  labels:
    app.kubernetes.io/name: kuberecord
    app.kubernetes.io/managed-by: kustomize
spec:
  # Which backend, and which CR of that backend: a name is only unique within a
  # kind, so both halves are the reference. `kind` may be omitted (it defaults to
  # ClickHouseSink); it is spelled here because that is the shape a cluster with
  # more than one sink kind has to write anyway.
  #
  # The pair is immutable: to move this rule to another sink, delete and recreate
  # it (avoids a cross-sink dedup/diff cache migration).
  sink:
    kind: ClickHouseSink
    name: default
  resources:
  - group: apps
    version: v1
    kind: Deployment
  - group: ""
    version: v1
    kind: ConfigMap
    # Only ConfigMaps carrying this label are streamed. Selector changes take
    # effect without restarting the shared informer.
    labelSelector:
      matchLabels:
        kuberecord.io/audit: "true"
  # Events are streamed in a built-in Events mode: full state every row, no
  # diffs, and a TTL expiry is recorded as nothing rather than as a deletion.
  # Capture is scope-wide — every Event in this namespace, not only those about
  # the Deployments and ConfigMaps above.
  - group: ""
    version: v1
    kind: Event
    # A labelSelector would be useless here — it matches the *Event's* labels,
    # and Events carry none — so Events are narrowed on the fields they do
    # carry. Within a list, OR; across fields, AND: this records every Event
    # about a Pod or a ReplicaSet except the ones a healthy rollout emits.
    #
    # Excluding is preferred over `reasons` (the include list, which cannot be
    # combined with this one): an exclusion keeps the reasons nobody has thought
    # of yet, whereas an include list silently stops recording the day a new
    # operator starts emitting something worth seeing.
    #
    # `types: [Warning]` is the other common shape, and is deliberately not
    # combined with the exclusions below: every reason listed there is a Normal
    # event, so naming both would leave three clauses that can never reject
    # anything the first one did not.
    #
    # None of this bounds volume. It narrows *which* Events are recorded; the
    # API server bumps a recurring Event's count in place, so every recurrence
    # is still another full row.
    eventFilter:
      excludeReasons: [Pulling, Pulled, Created, Started, Scheduled, SuccessfulCreate]
      subjectKinds: [Pod, ReplicaSet]
  # Added to the sink's own redaction floor — a rule can add paths, never remove
  # them. A path matching nothing in a given object is a silent no-op, so one
  # entry can cover a mixed resources list.
  extraRedaction:
  - fieldPath: spec.template.spec.containers[*].env[*].value

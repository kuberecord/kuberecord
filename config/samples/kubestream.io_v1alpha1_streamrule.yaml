apiVersion: kubestream.io/v1alpha1
kind: StreamRule
metadata:
  name: team-payments-workloads
  namespace: default
  labels:
    app.kubernetes.io/name: kubestream
    app.kubernetes.io/managed-by: kustomize
spec:
  # sinkRef is immutable: to move this rule to another sink, delete and
  # recreate it (avoids a cross-sink dedup/diff cache migration).
  sinkRef: default
  resources:
  - group: apps
    version: v1
    kind: Deployment
  - group: ""
    version: v1
    kind: ConfigMap
    # Only ConfigMaps carrying this label are streamed. Selector changes take
    # effect without restarting the shared informer.
    labelSelector:
      matchLabels:
        kubestream.io/audit: "true"
  # Added to the sink's own redaction floor — a rule can add paths, never remove
  # them. A path matching nothing in a given object is a silent no-op, so one
  # entry can cover a mixed resources list.
  extraRedaction:
  - fieldPath: spec.template.spec.containers[*].env[*].value

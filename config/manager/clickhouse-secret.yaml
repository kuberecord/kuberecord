apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-credentials
  namespace: system
  labels:
    app.kubernetes.io/name: kuberecord
    app.kubernetes.io/managed-by: kustomize
type: Opaque
stringData:
  # The password a ClickHouseSink reads through its
  # spec.connection.credentialsSecretRef. It lives in the operator's own
  # namespace because that is the only namespace the operator is granted Secret
  # reads in (Task 1.9), which is what keeps a cluster-scoped sink CR from
  # turning into a way to read any Secret in the cluster.
  #
  # TODO(user): This is a placeholder for local/dev use only. Before
  # deploying to a real cluster, replace this value — e.g. with a Kustomize
  # overlay (SecretGenerator), `kubectl create secret generic
  # clickhouse-credentials --from-literal=password=... --dry-run=client -o
  # yaml | kubectl apply -f -`, or a secret-management tool (Sealed
  # Secrets, External Secrets, SOPS...). Never commit a real password here.
  password: "changeme"

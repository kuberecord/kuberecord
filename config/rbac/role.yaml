---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
# Intentionally empty. This file is generated by controller-gen from
# +kubebuilder:rbac markers, and there are currently none: the per-GVK data-plane
# reconcilers that carried them (and needed pods/services/deployments
# get,list,watch) were replaced by the internal/pipeline workqueue, whose watch
# targets come from ClickHouseSink/StreamRule/ClusterStreamRule rather than from
# compiled-in markers.
#
# Leaving the old grants here would hand a deployed operator standing read access
# to workloads it no longer watches, so they are removed together with the code
# that used them. The base role's real contents arrive with the control-plane
# reconcilers (our own CRDs, SelfSubjectAccessReviews, events, namespaces) and the
# aggregated `kubestream-watcher` ClusterRole that platform admins extend to grant
# watch rights per resource family — see the RBAC task in the Phase 1 backlog.
#
# Leader-election (leases) and metrics-endpoint authz rights are unaffected: they
# live in leader_election_role.yaml and metrics_auth_role.yaml.
rules: []

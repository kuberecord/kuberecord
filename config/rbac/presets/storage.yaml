# Watch preset: storage. Not installed by default — apply it to stream volumes,
# claims and the cluster's storage plumbing.
#
# `get,list,watch` only, and never `secrets` — note in particular that CSI
# driver credentials live in Secrets and are deliberately out of reach here; see
# presets/core-workloads.yaml and docs/RBAC.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kuberecord
    app.kubernetes.io/managed-by: kustomize
    kuberecord.io/aggregate-to-watcher: "true"
  name: watcher-storage
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumes
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  - volumeattachments
  - csidrivers
  - csinodes
  verbs:
  - get
  - list
  - watch

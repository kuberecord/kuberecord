# Watch preset: RBAC objects. Not installed by default, and the one preset worth
# a second thought before applying.
#
# Streaming Roles and bindings is the highest-value audit trail kubestream can
# produce ("who was granted cluster-admin, and when?"), but it also means the
# operator reads the cluster's full authorization graph and every change to it
# lands in ClickHouse. Combined with the read-flattening caveat in docs/RBAC.md,
# anyone who can query the sink can reconstruct that graph. Apply this preset
# when that trade is one you want; leave it out when it is not.
#
# Reading a role's *rules* is not the same as holding them: Kubernetes' escalation
# check binds the operator exactly as it binds any other subject, so this grant
# cannot become a privilege-escalation path.
#
# `get,list,watch` only, and never `secrets` (D8) — see presets/core-workloads.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubestream
    app.kubernetes.io/managed-by: kustomize
    kubestream.io/aggregate-to-watcher: "true"
  name: watcher-rbac-read
rules:
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  - clusterroles
  - clusterrolebindings
  verbs:
  - get
  - list
  - watch

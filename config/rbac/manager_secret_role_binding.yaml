# Binds the *namespaced* half of the base role (Secret reads) to the operator.
#
# The Secret grant is a Role, not a ClusterRole, and this is a RoleBinding in the
# operator's own namespace — which is what turns
# `ClickHouseSink.spec.connection.credentialsSecretRef.namespace`'s default into
# a real boundary rather than a convenience: a cluster-scoped sink pointed at a
# Secret in some other namespace cannot make the operator read it, because the
# operator holds no Secret rights there.
#
# Kept separate from role_binding.yaml (the ClusterRoleBinding for the cluster
# half of the same generated role) so that the two scopes cannot be conflated by
# a future edit: promoting this to cluster scope would require deleting a file,
# not changing a field.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: kuberecord
    app.kubernetes.io/managed-by: kustomize
  name: manager-secret-rolebinding
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manager-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system

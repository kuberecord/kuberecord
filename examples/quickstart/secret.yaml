# The credentials Secret a ClickHouseSink reads its password from.
#
# It lives in the operator's own namespace because that is the only namespace the
# operator is granted Secret reads in — a namespaced Role, never the ClusterRole
# (see docs/RBAC.md). That is what stops a cluster-scoped sink CR from being a
# way to read any Secret in the cluster, and it is why
# `spec.connection.credentialsSecretRef.namespace` defaults to this namespace
# rather than to the sink's own.
#
# Applying this replaces the `changeme` placeholder that ships with
# `config/manager/clickhouse-secret.yaml`, which is exactly the step a real
# install has to take too. For a real install, take it with a secret manager
# (Sealed Secrets, External Secrets, SOPS) or a Kustomize SecretGenerator — not
# with a value committed to a repository, as this evaluation-only file does.
apiVersion: v1
kind: Secret
metadata:
  name: kubestream-clickhouse-credentials
  namespace: kubestream-system
  labels:
    app.kubernetes.io/name: kubestream
    app.kubernetes.io/component: quickstart
type: Opaque
stringData:
  # Must match the server-side password in examples/quickstart/clickhouse.yaml.
  # A test in test/docs asserts that it does.
  password: "quickstart"

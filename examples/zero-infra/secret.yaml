# The credentials the S3Sink authenticates to the object store with.
#
# It lives in the operator's own namespace because that is the only namespace the
# operator is granted Secret reads in — a namespaced Role, never the ClusterRole
# (see docs/RBAC.md). That is what stops a cluster-scoped sink CR from being a way
# to read any Secret in the cluster, and it is why
# `spec.credentials.secretRef.namespace` defaults to this namespace rather than to
# the sink's own. examples/zero-infra/sink.yaml therefore omits the namespace.
#
# The key names are fixed rather than configurable: an S3Sink reads `accessKeyId`
# and `secretAccessKey`, and a Secret carrying neither reports
# CredentialsResolved=False/SecretKeyMissing rather than silently authenticating
# as nobody.
#
# For a real install, do not do this. Take the key pair with a secret manager
# (Sealed Secrets, External Secrets, SOPS) or — far better on a cloud provider —
# delete the whole `credentials` block from the S3Sink and authenticate from the
# ambient chain (IRSA, workload identity, an instance role). There is then no
# long-lived key to leak or rotate, and the sink reports
# CredentialsResolved=True/AmbientCredentials.
apiVersion: v1
kind: Secret
metadata:
  name: kuberecord-zero-infra-s3-credentials
  namespace: kuberecord-system
  labels:
    app.kubernetes.io/name: kuberecord
    app.kubernetes.io/component: zero-infra-example
type: Opaque
stringData:
  # Must match the server-side root credentials in examples/zero-infra/minio.yaml.
  # A test in test/docs asserts that they do.
  accessKeyId: "kuberecord"
  secretAccessKey: "kuberecord-zero-infra"

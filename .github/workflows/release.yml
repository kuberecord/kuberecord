# Tag-triggered releases (Task 3.5). Strangers install tags, not `main`.
#
# Pushing `vX.Y.Z` publishes a multi-arch image at
# ghcr.io/<owner>/kuberecord:vX.Y.Z, the Helm chart at
# oci://ghcr.io/<owner>/charts/kuberecord:X.Y.Z, a GitHub Release whose body is
# that version's CHANGELOG.md section, and the install artifacts plus their
# checksums and an SBOM attached to it. Since Task 7.4 it also publishes the
# evidence: the image and the chart each carry a keyless cosign signature, and the
# image and every attached asset carry SLSA build provenance. `workflow_dispatch`
# runs the identical sequence with nothing pushed to a public registry and nothing
# published, which is what makes a rehearsal meaningful.
#
# Since Task 12.1 the CLI ships from this same run rather than from a pipeline of
# its own: one archive per platform, each carrying both binary names, cross-compiled
# cgo-free in the publish job and described by an SBOM of their own. They are signed
# the only way a file on a Release page can be — through checksums.txt, which names
# every asset by content and is what `cosign sign-blob` puts a keyless signature
# over.
#
# The chart is published two ways on purpose (Task 8.1). The `.tgz` on the Release
# page reaches a reader through a GitHub redirect from this repository's
# pre-migration path, and that redirect disappears permanently the day anyone
# creates a repository of the same name under the old account. The registry
# reference depends on no such thing.
#
# A signature and an attestation are themselves publications — a registry write, a
# public transparency-log entry, a record against this repository — so a rehearsal
# cannot perform them and still be a rehearsal. It goes as far as it can: it builds
# a real SBOM from a locally built image, computes every attestation subject,
# performs a real `helm push` against a throwaway registry on the runner, and
# prints the signing and verification commands it is deliberately not running.
# docs/VERIFYING.md is the reader-facing half of all of this.
#
# Every step is `make <target>`, and the targets are the ones a maintainer runs by
# hand (see the Release section of the Makefile and docs/RELEASING.md). This file
# decides *when* a release happens and *whether it is real* — it does not decide
# what a release is.
#
# The gate job runs first and everything else needs it: a tag that disagrees with
# the committed VERSION, or that has no changelog section, fails before an image
# is pushed. Publishing is not undoable — a pushed tag in a registry is visible to
# everyone immediately — so the ordering is the point, not an optimisation.
name: Release

on:
  push:
    tags:
      # Plain releases and prereleases, spelled out rather than `v*` so a stray
      # tag (`v1-old-branch`, `vendor-sync`) cannot start a release.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse, e.g. v0.1.0-rc.1. Nothing is pushed or published.'
        required: true
        type: string

permissions: {}

env:
  # One place decides what is being released and whether it is real. A dry run is
  # anything that is not a tag push, so a rehearsal cannot become a release by
  # forgetting to set a flag — it has to be triggered as one.
  RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  DRY_RUN: ${{ github.event_name != 'push' }}

jobs:
  gate:
    name: Version and changelog gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # No Go toolchain: this job reads the Makefile, Chart.yaml and CHANGELOG.md
      # and nothing else, and it is the job that must not be slow — it is what
      # stands between a mistyped tag and a published one.
      - name: The tag agrees with the tree it points at
        run: make release-verify-version RELEASE_VERSION="$RELEASE_VERSION"

      - name: The tag has release notes
        run: make release-notes RELEASE_VERSION="$RELEASE_VERSION"

      - name: Show the notes that will be published
        run: |
          {
            echo "## Release notes for $RELEASE_VERSION"
            echo
            echo "Dry run: \`$DRY_RUN\`"
            echo
            cat dist/release/RELEASE_NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Multi-arch image
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only needed for the push, and granted unconditionally because a job's
      # permissions cannot depend on an env value. The login step is what is
      # actually skipped on a dry run, so an unpushed rehearsal never authenticates.
      packages: write
      # Keyless signing and build provenance both need an OIDC token, and this is
      # the first point in the release at which there is anything to sign: a
      # signature is about a digest, and the digest does not exist until the push
      # above it. Granted here rather than at the top of the file so the gate job —
      # the one that runs before anything is published, and the one most worth
      # keeping powerless — cannot mint a signing identity for this repository.
      id-token: write
      # actions/attest-build-provenance writes the attestation to GitHub's
      # attestations API; push-to-registry additionally stores it beside the image,
      # which is what `packages: write` above already covers.
      attestations: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # cosign and syft are installed by their vendors' own actions, both pinned
      # like every other action here. The versions are pinned too, rather than
      # floating on each action's default: what signed a release and what described
      # it are part of the release, and a tool that changed under us between two
      # tags would be invisible in the artifacts.
      #
      # Installed on a rehearsal as well, though a rehearsal signs nothing. A pin
      # that no longer resolves, or an installer whose interface moved, then fails
      # in the rehearsal — which is the run where a failure costs nothing.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0

      # The image is cross-compiled inside the builder stage (the Dockerfile takes
      # GOARCH from TARGETARCH with CGO disabled), so every platform builds
      # natively on the runner and no QEMU is involved. Nothing needs a Go
      # toolchain out here.
      - name: Log in to ghcr.io
        if: env.DRY_RUN == 'false'
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io --username '${{ github.actor }}' --password-stdin

      - name: Build the image for every supported platform
        run: |
          # Empty BUILDX_OUTPUT builds and discards; --push is the Makefile default.
          if [ "$DRY_RUN" = "true" ]; then
            make release-image RELEASE_VERSION="$RELEASE_VERSION" BUILDX_OUTPUT=
          else
            make release-image RELEASE_VERSION="$RELEASE_VERSION"
          fi

      # Everything below is about what was just pushed, so all of it is skipped on
      # a rehearsal — except the SBOM, which a rehearsal produces from a local
      # build, and the summary of what a real run would have signed.
      - name: Record what was pushed
        id: image
        if: env.DRY_RUN == 'false'
        run: |
          make release-image-digest RELEASE_VERSION="$RELEASE_VERSION"
          # The attestation step cannot read a make variable, so it reads the two
          # files the target just wrote. IMAGE_REPO stays named in one place.
          {
            printf 'name=%s\n' "$(cat dist/release/image-name.txt)"
            printf 'digest=%s\n' "$(cat dist/release/image-digest.txt)"
          } >> "$GITHUB_OUTPUT"

      - name: Sign the image
        if: env.DRY_RUN == 'false'
        run: make release-sign RELEASE_VERSION="$RELEASE_VERSION"

      - name: Describe the image (SBOM)
        if: env.DRY_RUN == 'false'
        run: make release-sbom RELEASE_VERSION="$RELEASE_VERSION"

      - name: Describe a locally built image instead (rehearsal)
        if: env.DRY_RUN == 'true'
        run: make release-sbom-local RELEASE_VERSION="$RELEASE_VERSION"

      - name: Attest the image's build provenance
        if: env.DRY_RUN == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          # Stored beside the image as well as against the repository, so
          # verification does not have to depend on this repository's API still
          # answering. It does not make the attestation survive a naive mirror —
          # signatures and attestations live under their own references, and
          # `docker pull && docker push` copies neither (docs/VERIFYING.md says so
          # to a reader, rather than letting them find out).
          push-to-registry: true

      # The published verification commands, run against what was just published.
      # This is what keeps docs/VERIFYING.md honest: if the signature does not
      # verify under the identity the documentation tells a reader to pin, the
      # release fails here — before the GitHub Release that advertises it exists.
      - name: Verify the signature and the attestation
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release-verify RELEASE_VERSION="$RELEASE_VERSION"

      - name: Show what a real run would sign and attest (rehearsal)
        if: env.DRY_RUN == 'true'
        run: make release-rehearse-publishing RELEASE_VERSION="$RELEASE_VERSION"

      # The SBOM is attached to the Release by the publish job, which cannot
      # produce it: it describes an image, and the image exists here.
      - name: Hand the SBOM to the publish job
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: kuberecord-${{ env.RELEASE_VERSION }}-sbom
          path: dist/release/*-sbom.spdx.json
          if-no-files-found: error

      - name: Summarise
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Rehearsal: image and SBOM for $RELEASE_VERSION"
              echo
              echo "Nothing was pushed, signed or attested. The SBOM attached to this"
              echo "run describes a locally built image of the runner's architecture."
            else
              echo "## Signed and attested $RELEASE_VERSION"
              echo
              echo "| What | Value |"
              echo "|---|---|"
              echo "| Image | \`$(cat dist/release/image-name.txt)\` |"
              echo "| Digest | \`$(cat dist/release/image-digest.txt)\` |"
              # github.workflow_ref is exactly the certificate identity a keyless
              # signature carries, minus the scheme — so this row is the string a
              # verifier has to pin, read from the run itself rather than retyped.
              echo "| Signed by | \`https://github.com/${{ github.workflow_ref }}\` |"
              echo
              echo "Verify it: https://github.com/${{ github.repository }}/blob/$RELEASE_VERSION/docs/VERIFYING.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Artifacts and GitHub Release
    # Both, not just the gate: an image that failed to build must not get a
    # release pointing at it, because the manifests attached below pin that exact
    # tag and a cluster applying them would sit in ImagePullBackOff.
    needs: [gate, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The chart is pushed to ghcr.io from here, and it has to be pushed from
      # here: `helm package` stamps the current time into every tar header, so the
      # only way the registry artifact and the `.tgz` on the Release page are the
      # same bytes is for the job that packaged it to be the job that pushes it.
      # Anything else publishes two archives with two digests for one version, and
      # checksums.txt would then describe only one of them.
      #
      # That does cost something, and it is worth naming rather than leaving
      # implied: this job can now write to the registry, so the split below is no
      # longer symmetric. What survives is the half that matters most — the image
      # job still cannot publish a Release, so a compromised build step cannot
      # announce itself.
      packages: write
      # The second job that needs OIDC, and for the other half of the release: an
      # attestation names a digest, the artifacts below are built here, and they
      # exist nowhere earlier.
      id-token: write
      attestations: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # kustomize, controller-gen, helm and kubeconform are all bootstrapped into
      # bin/ by the Makefile, so a Go toolchain is the only prerequisite.
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # The chart is signed here for the same reason the image is signed in the
      # job above: the signature is over a digest, and the digest does not exist
      # until the push. Same pin as the image job — what signed a release is part
      # of the release, and two cosign versions across one tag would be invisible
      # in the artifacts.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # syft is needed here as well as in the image job since Task 12.1: the CLI
      # is a second binary with a second dependency set, and it is built here.
      # Same pin, for the same reason — what described a release is part of it.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0

      # oras publishes Artifact Hub's repository metadata as its own OCI artifact
      # beside the chart — the ownership claim that keeps the Artifact Hub listing
      # verified. It is installed unconditionally, like the two above, because the
      # rehearsal exercises that push too (against a throwaway registry on the
      # runner), and a tool missing only on the dry-run path is a tool whose absence
      # is discovered at tag time. Pinned for the same reason as cosign and syft.
      #
      # The version here is not free: this action resolves and checksums the
      # download from a release list bundled *inside the action*
      # (src/lib/data/releases.json), so the ceiling is whatever the pinned action
      # tag knew about, not whatever oras has published. v2.0.1's list ends at
      # 1.3.3. Naming a newer oras fails the step outright —
      #
      #     official ORAS CLI releases does not contain version 1.3.4
      #
      # — and it fails at install time on a release run, which is the worst place
      # to find out. So raising this pin means checking that release list first,
      # and usually raising the action pin with it. There is no newer *tag* than
      # v2.0.1 to raise it to; only main carries a longer list, and an untagged
      # branch commit is worse provenance for a release tool than an oras patch
      # release is worth.
      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      # This builds the CLI too (Task 12.1): `make release-artifacts` cross-compiles
      # kubectl-kuberecord and kuberecord for every platform in CLI_PLATFORMS, with
      # CGO_ENABLED=0 asserted against the produced binaries rather than against the
      # command line, and packages both names into one archive per platform. It runs
      # on a rehearsal exactly as it does on a release — a cross-compile is a build,
      # and building it is the half of the CLI story that can go wrong without
      # publishing anything.
      - name: Build the release artifacts, the CLI archives included
        run: make release-artifacts RELEASE_VERSION="$RELEASE_VERSION"

      # The SBOM describes the image, so the image job produced it; it is attached
      # to the Release, so this job publishes it. Downloaded before the checksums
      # are computed, because it is one of the assets they cover.
      - name: Collect the SBOM built beside the image
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: kuberecord-${{ env.RELEASE_VERSION }}-sbom
          path: dist/release

      # The CLI's SBOM, unlike the image's, needs nothing published: it is scanned
      # from the binary that was just built. So it runs on a rehearsal as well, and
      # a rehearsal's document is the real one rather than a stand-in.
      - name: Describe the CLI (SBOM)
        run: make release-cli-sbom RELEASE_VERSION="$RELEASE_VERSION"

      - name: Checksum every asset, both SBOMs and the CLI archives included
        run: make release-checksums RELEASE_VERSION="$RELEASE_VERSION"

      # The krew manifest and the Homebrew formula were generated inside
      # `release-artifacts` and checked against the checksums file that existed
      # then. The step above rewrote that file to take in the two SBOMs, so they
      # are checked again — against the finished one, before anything is attested
      # or signed. Neither document should have changed: they hash the archives,
      # not the list. That is the invariant, and this is where it is worth
      # re-asserting rather than assuming.
      #
      # It runs on a rehearsal too. Re-deriving a digest publishes nothing, and a
      # manifest that stopped describing the archives is exactly the failure a
      # rehearsal exists to find before a tag does.
      - name: The krew manifest and the formula still describe the archives
        run: make release-krew-verify RELEASE_VERSION="$RELEASE_VERSION"

      # checksums.txt is handed over as the subject list rather than a glob of
      # dist/release/: "what is checksummed" and "what is attested" are then the
      # same set by construction. A glob that stopped matching one asset would
      # have narrowed the attestation silently, and an attestation nobody notices
      # is missing is worth very little.
      - name: Attest the artifacts' build provenance
        if: env.DRY_RUN == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/release/checksums.txt

      # The archives have no digest a registry could name, so the signature is over
      # checksums.txt — the file that already names every asset by content, and the
      # file the attestation above takes its subjects from. One signature therefore
      # covers the CLI archives, install.yaml, the chart and both SBOMs, and a
      # reader verifies the signature over the list and the list over the bytes.
      #
      # It runs after the attestation because it signs the finished file: a
      # checksums.txt that changed afterwards would leave a valid signature over a
      # list nobody published.
      - name: Sign the artifacts' checksums
        if: env.DRY_RUN == 'false'
        run: make release-artifacts-sign RELEASE_VERSION="$RELEASE_VERSION"

      # The published verification commands, run against what was just signed —
      # the artifacts' half of what the image job does, and what keeps the CLI
      # section of docs/VERIFYING.md from being a promise nobody checks.
      - name: Verify the checksums signature and the checksums
        if: env.DRY_RUN == 'false'
        run: make release-artifacts-verify RELEASE_VERSION="$RELEASE_VERSION"

      - name: Show the subjects a real run would attest (rehearsal)
        if: env.DRY_RUN == 'true'
        run: |
          {
            echo "## Rehearsal: the subjects a release would attest"
            echo
            echo "Each line below would become one SLSA provenance subject, and one"
            echo "\`cosign sign-blob\` over this file would cover all of them. Nothing"
            echo "was attested and nothing was signed; the CLI archives listed here were"
            echo "built for real and are attached to this run."
            echo
            echo '```'
            cat dist/release/checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded on every run, dry or not. On a rehearsal this is the *only* place
      # the artifacts exist, and being able to diff a candidate's install.yaml
      # against the previous release's is most of the value of rehearsing.
      - name: Upload the artifacts to the workflow run
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: kuberecord-${{ env.RELEASE_VERSION }}
          path: |
            dist/release/install.yaml
            dist/release/*.tgz
            dist/release/kuberecord_*.tar.gz
            dist/release/kuberecord_*.zip
            dist/release/kuberecord.yaml
            dist/release/kuberecord.rb
            dist/release/checksums.txt
            dist/release/*-sbom.spdx.json
            dist/release/RELEASE_NOTES.md
          if-no-files-found: error

      # The chart as an OCI artifact (Task 8.1), pushed before the Release page
      # that advertises it exists. The ordering is the same argument as the
      # image's: the page tells a reader to `helm install oci://…`, and a page
      # that says so before the artifact is there hands its first readers a 404.
      #
      # What is pushed is the archive `make release-artifacts` produced above, not
      # a fresh packaging of the same chart — see the Makefile. The consequence is
      # worth knowing while reading this: the layer inside the registry artifact
      # is byte-for-byte the `.tgz` attached below, so the checksums and the
      # artifact attestation already cover both ways of getting the chart.
      - name: Log in to ghcr.io for the chart push
        if: env.DRY_RUN == 'false'
        env:
          CHART_REGISTRY_USER: ${{ github.actor }}
          CHART_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release-chart-login

      - name: Push the chart to the registry
        if: env.DRY_RUN == 'false'
        run: make release-chart-push RELEASE_VERSION="$RELEASE_VERSION"

      - name: Sign the chart
        if: env.DRY_RUN == 'false'
        run: make release-chart-sign RELEASE_VERSION="$RELEASE_VERSION"

      # The published verification command, run against what was just pushed —
      # the chart's half of what the image job does, and what keeps the chart
      # section of docs/VERIFYING.md from being a promise nobody checks.
      - name: Verify the chart signature
        if: env.DRY_RUN == 'false'
        run: make release-chart-verify RELEASE_VERSION="$RELEASE_VERSION"

      # Artifact Hub's ownership claim, pushed to the chart's own repository under
      # the `artifacthub.io` tag that Artifact Hub reads (see the Makefile for why
      # that tag and that layer media type are not negotiable). It goes last of the
      # chart steps on purpose: it is metadata *about* a repository, so pushing it
      # before there is a chart in that repository would advertise ownership of
      # something not yet published. It is also the one chart step whose failure
      # costs nothing published — the chart is already up and signed — but it still
      # fails the job rather than being tolerated, because a listing that quietly
      # stops being verified is exactly the kind of silent gap nothing else here
      # would report.
      - name: Publish the Artifact Hub repository metadata
        if: env.DRY_RUN == 'false'
        run: make release-chart-metadata-push RELEASE_VERSION="$RELEASE_VERSION"

      # A rehearsal cannot push to ghcr.io — that is a publication — but it can
      # push, and a push is the step with something to get wrong. It runs against
      # a throwaway registry on the runner, which exercises the reference, the
      # flags and the digest parse and reaches nothing outside this job.
      - name: Rehearse the chart push against a throwaway registry
        if: env.DRY_RUN == 'true'
        run: make release-chart-rehearse RELEASE_VERSION="$RELEASE_VERSION"

      - name: Publish the GitHub Release
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag with a prerelease suffix is marked as one, so it stays out of
          # "latest release" for anyone reading the repository's front page.
          prerelease=""
          case "$RELEASE_VERSION" in *-*) prerelease="--prerelease" ;; esac

          # shellcheck disable=SC2086  # $prerelease is a flag or nothing
          gh release create "$RELEASE_VERSION" \
            --title "kuberecord $RELEASE_VERSION" \
            --notes-file dist/release/RELEASE_NOTES.md \
            --verify-tag \
            $prerelease \
            dist/release/install.yaml \
            dist/release/kuberecord-*.tgz \
            dist/release/kuberecord_*.tar.gz \
            dist/release/kuberecord_*.zip \
            dist/release/kuberecord.yaml \
            dist/release/kuberecord.rb \
            dist/release/checksums.txt \
            dist/release/checksums.txt.sigstore.json \
            dist/release/*-sbom.spdx.json

      # The other half of the digest check, and the half the acceptance criterion
      # names: not "the documents describe what was built" but "the URLs in them
      # resolve to it". It runs here because it cannot run earlier — the assets do
      # not exist until the Release does — and the failures it catches are the ones
      # a local check is blind to: an asset that never uploaded, a file name the
      # Release page spells differently, a tag that is not there.
      #
      # It is the last step that can fail, and it fails after the Release is
      # public. That is the right way round: the alternative is finding out from
      # somebody whose `krew install` 404s.
      - name: Every URL krew and brew publish resolves to the digest it claims
        if: env.DRY_RUN == 'false'
        run: make release-krew-verify-published RELEASE_VERSION="$RELEASE_VERSION"

      - name: Summarise
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Dry run for $RELEASE_VERSION — nothing pushed, nothing published"
              echo
              echo "The artifacts are attached to this workflow run. The chart push was"
              echo "rehearsed against a throwaway registry and reached no public one."
            else
              echo "## Released $RELEASE_VERSION"
              echo
              # Read the image back out of the manifest rather than restating it:
              # what the release actually pins is what install.yaml says it pins.
              echo "Image: \`$(grep -o 'image: [^ ]*kuberecord:[^ ]*' dist/release/install.yaml | head -1 | cut -d' ' -f2)\`"
              echo
              # The chart's digest, read from what the push reported rather than
              # re-resolved — the same digest that was signed.
              echo "Chart: \`oci://ghcr.io/kuberecord/charts/kuberecord:${RELEASE_VERSION#v}\`"
              echo "(\`$(cat dist/release/chart-digest.txt)\`)"
              echo
              # The ownership claim is republished on every tag, to the same
              # `artifacthub.io` tag each time. Named here so a reader of the
              # summary can tell it happened; Artifact Hub picks it up on its own
              # schedule, so the listing updates after this run, not during it.
              echo "Artifact Hub metadata: \`ghcr.io/kuberecord/charts/kuberecord:artifacthub.io\`"
              echo
              echo "CLI: $(ls dist/release/kuberecord_*.tar.gz dist/release/kuberecord_*.zip | wc -l) archives, signed through checksums.txt"
              echo
              echo "krew: \`dist/release/kuberecord.yaml\`, attached and checksummed. Submitting it to"
              echo "kubernetes-sigs/krew-index is \`make krew-index-pr\`, run by a maintainer —"
              echo "a tag push does not open a pull request on somebody else's repository."
              echo
              echo "Signed, attested and described. How to check any of that:"
              echo "https://github.com/${{ github.repository }}/blob/$RELEASE_VERSION/docs/VERIFYING.md"
            fi
            echo
            echo '```'
            cat dist/release/checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The Homebrew tap (Task 12.2). A job of its own, after the Release exists,
  # because it publishes into a *different* repository — `kuberecord/homebrew-tap`,
  # which is what `brew tap kuberecord/tap` consumes.
  #
  # Separate rather than a step of `publish` for two reasons. The Release is
  # already public by the time this runs, so a tap failure must be loudly red
  # without implying the release did not happen; and this is the only job holding a
  # token for another repository, which is a thing worth being able to point at.
  #
  # The formula it pushes is downloaded back off the Release page and checked
  # against the signed checksums.txt, rather than rebuilt here. Rebuilding would
  # put a file in the tap that nothing had signed — installable by anyone,
  # verifiable by nobody.
  #
  # There is no job-level `if:`. GitHub does not expose the `env` context to one,
  # so DRY_RUN is unavailable there, and spelling the same gate two ways is how a
  # rehearsal eventually publishes something. Every step that touches anything
  # published carries the step-level gate the rest of this file uses; on a
  # rehearsal the job runs and does nothing but say so.
  tap:
    name: Homebrew tap
    needs: [gate, publish]
    runs-on: ubuntu-latest
    permissions:
      # Only to check this repository out for its Makefile. Writing to the tap is
      # HOMEBREW_TAP_TOKEN's job, and no GITHUB_TOKEN scope can do it: a token is
      # issued for the repository the workflow lives in.
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Same pin as the two jobs above. The formula is only as trustworthy as the
      # signature it was checked against, so this job verifies one.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Take the formula off the Release page and verify it
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release-brew-fetch RELEASE_VERSION="$RELEASE_VERSION"

      # A prerelease is refused by the target itself, with a message and exit 0:
      # `brew install` has no way to ask for a stable version, so a tap carrying a
      # candidate hands it to everybody.
      - name: Push it to the tap
        if: env.DRY_RUN == 'false'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: make release-brew-push RELEASE_VERSION="$RELEASE_VERSION"

      - name: Say what a real run would push (rehearsal)
        if: env.DRY_RUN == 'true'
        run: |
          {
            echo "## Rehearsal: the Homebrew tap was not touched"
            echo
            echo "A release takes the published \`kuberecord.rb\` off its own Release page, checks"
            echo "it against the signed \`checksums.txt\`, and pushes it to the tap. None of that"
            echo "can be rehearsed: there is no published release to read it from."
            echo
            echo "The formula itself *was* built, for real, and is attached to this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarise
        if: env.DRY_RUN == 'false'
        run: |
          {
            echo "## Homebrew"
            echo
            echo '```sh'
            echo "brew install kuberecord/tap/kuberecord"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

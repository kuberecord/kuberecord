name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

  cross-compile:
    permissions:
      contents: read
    name: Cross-compile the CLI
    runs-on: ubuntu-latest
    # A job of its own rather than a step of the one above, for two reasons. It is
    # the only thing in CI that builds for a platform nobody here runs, so a
    # failure should say so by name; and it runs while the tests do, so the wall
    # clock of a pull request is unchanged.
    #
    # It exists because D18's cgo-free cross-compile is load-bearing for krew and
    # would otherwise regress silently: a dependency that needs cgo, or a build
    # tag that pulls one in, breaks only for the four platforms nobody builds
    # locally — and the first person to find out would be somebody running
    # `kubectl krew install kuberecord` on a release that had already shipped.
    # `make build-cli` asserts CGO_ENABLED=0 by reading it back out of each
    # produced binary, not by trusting the environment it set (Task 12.1).
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Build both binary names for every platform, cgo-free
        run: make build-cli

      # And the two documents that tell krew and Homebrew where those archives are
      # and what they hash to (Task 12.2). Packaged, generated and checked here on
      # every pull request rather than only at tag time, because the failure mode
      # is a naming drift nothing else notices: the archives are named by the
      # Makefile and the URIs are generated from that naming, so a renamed archive
      # produces a manifest full of URLs that 404 with every other step passing.
      #
      # It publishes nothing and touches no tap. `release-cli` re-enters
      # `build-cli` above, which the Go build cache makes a relink rather than a
      # second cross-compile.
      - name: The krew manifest and the Homebrew formula describe the archives
        run: |
          make release-cli
          make release-krew-manifest
          make release-brew-formula
          make release-krew-verify

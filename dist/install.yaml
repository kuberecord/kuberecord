apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: kuberecord
    control-plane: controller-manager
  name: kuberecord-system
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clickhousesinks.kuberecord.io
spec:
  group: kuberecord.io
  names:
    kind: ClickHouseSink
    listKind: ClickHouseSinkList
    plural: clickhousesinks
    singular: clickhousesink
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    - jsonPath: .spec.connection.addr
      name: ADDR
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClickHouseSink declares one ClickHouse instance kuberecord may write to.

          It is cluster-scoped (D6) because rules in any namespace reference it by
          name, and because a sink is infrastructure owned by the platform team rather
          than by whoever owns the namespace a rule lives in. The password is the only
          part not in this object; it lives in the Secret named by
          spec.connection.credentialsSecretRef.

          The ADDR printer column shows the full "host:port" from
          spec.connection.addr: CRD printer columns are plain JSONPath with no string
          functions, so the host cannot be split out declaratively.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ClickHouseSink.
            properties:
              connection:
                description: Connection is how to reach ClickHouse.
                properties:
                  addr:
                    description: |-
                      Addr is the ClickHouse native-protocol endpoint as "host:port", e.g.
                      "clickhouse.kuberecord-system.svc:9000".
                    maxLength: 253
                    minLength: 1
                    type: string
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef names the Secret holding this sink's password.
                      Its namespace defaults to the operator's own namespace — see
                      SecretReference.Namespace for why that default is a security boundary
                      rather than a convenience.
                    properties:
                      name:
                        description: Name is the Secret's name.
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        description: |-
                          Namespace is the Secret's namespace. Empty means the namespace the
                          operator itself runs in.

                          That default is a security property, not a convenience: the operator's
                          aggregated ClusterRole grants Secret read access *only* in its own
                          namespace (Task 1.9, D7). A cluster-scoped ClickHouseSink is editable by
                          anyone with cluster-level write access to the CRD, so if this field
                          could freely name any namespace, creating a sink would become a way to
                          make the operator read a Secret its RBAC never intended to expose. Left
                          empty, a sink can only ever reach credentials an administrator has
                          deliberately placed alongside the operator.
                        maxLength: 63
                        type: string
                    required:
                    - name
                    type: object
                  database:
                    default: kuberecord
                    description: Database is the ClickHouse database holding kuberecord's
                      tables.
                    maxLength: 63
                    minLength: 1
                    type: string
                  dialTimeout:
                    default: 5s
                    description: DialTimeout bounds establishing a connection to Addr.
                    type: string
                  readTimeout:
                    default: 10s
                    description: ReadTimeout bounds a single query's read phase.
                    type: string
                  username:
                    default: default
                    description: |-
                      Username is the ClickHouse user the operator authenticates as. Its
                      password comes from CredentialsSecretRef.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - addr
                - credentialsSecretRef
                type: object
              policy:
                description: Policy restricts what may be written to this sink.
                properties:
                  allowedGVKs:
                    description: |-
                      AllowedGVKs restricts which resource types may be streamed to this sink.

                      An empty (or omitted) list allows everything *except* the hard deny-list
                      — v1/Secret is never watchable in v1alpha1 (D8) and no policy here can
                      re-enable it. Deny is enforced in code, not merely in config, so the
                      permissive default can never become a way to exfiltrate Secrets.
                    items:
                      description: |-
                        GVKSelector matches a set of resource types for sink admission policy.

                        It is a group/version plus a *list* of kinds (rather than a flat GVK list)
                        because the common policy statement is "everything in this group" — spelled
                        `kinds: ["*"]` — and enumerating every Kind of a large group by hand would
                        both bloat the CR and go stale the moment a new Kind ships.
                      properties:
                        group:
                          default: ""
                          description: Group is the API group this selector admits.
                            Empty means the core group.
                          maxLength: 253
                          pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                        kinds:
                          description: |-
                            Kinds are the admitted Kinds within group/version. The single entry `*`
                            admits every Kind in that group/version.

                            The list is a set: the API server rejects duplicate entries outright
                            (`x-kubernetes-list-type: set`), which is both cheaper and stricter than
                            an equivalent CEL uniqueness rule would be.
                          items:
                            maxLength: 63
                            pattern: ^(\*|[A-Z][A-Za-z0-9]{0,62})$
                            type: string
                          maxItems: 128
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                        version:
                          description: Version is the API version this selector admits.
                          maxLength: 63
                          pattern: ^v[0-9]+((alpha|beta)[0-9]+)?$
                          type: string
                      required:
                      - kinds
                      - version
                      type: object
                    maxItems: 128
                    type: array
                  redaction:
                    description: |-
                      Redaction is this sink's redaction floor: value paths scrubbed out of
                      every object any rule streams here, before hashing (Task 3.3).

                      It lives on the sink for the same reason AllowedGVKs does. Whoever owns
                      the ClickHouse instance owns what may land in it, and that authority has
                      to hold without reviewing every StreamRule anyone writes — so a rule may
                      add paths through its own `spec.extraRedaction`, but nothing a rule
                      declares can remove one listed here.

                      An empty list is not "no redaction": the data plane always scrubs
                      `kubectl.kubernetes.io/last-applied-configuration`, which embeds whole
                      prior copies of the objects it annotates.
                    items:
                      description: |-
                        RedactionRule names one value to scrub out of every streamed object before it
                        is hashed, diffed and written (Task 3.3).

                        Exactly one of the two fields is set. They are separate fields rather than one
                        string with two grammars because an annotation key routinely contains dots and
                        slashes — `kubectl.kubernetes.io/last-applied-configuration` — which the
                        dot-segment path syntax cannot spell unambiguously: written as a `fieldPath`
                        it would mean six nested maps that do not exist. The shorthand is therefore
                        the only way to name such a key, not sugar over a longer form.

                        Redaction is *additive* everywhere it appears. A sink's policy is the floor,
                        a rule's `extraRedaction` adds to it, and rules that overlap on one target
                        contribute a union — nothing anywhere can remove a path another party asked
                        for. That is what lets a platform team hand out a sink whose redaction floor
                        they own without reviewing every rule written against it.
                      properties:
                        annotation:
                          description: |-
                            Annotation is the shorthand for one annotation key, equivalent to a
                            fieldPath of `metadata.annotations` indexed by this exact key.

                            `kubectl.kubernetes.io/last-applied-configuration` never needs listing: it
                            is scrubbed on every object under every policy, including an empty one,
                            because kubectl copies the entire submitted object into it and it would
                            otherwise re-leak every value the rest of the policy removes.
                          maxLength: 253
                          minLength: 1
                          pattern: ^([a-z0-9]([-a-z0-9.]*[a-z0-9])?/)?[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$
                          type: string
                        fieldPath:
                          description: |-
                            FieldPath is the value to scrub, as dot-separated field names with an
                            optional `[*]` wildcard over arrays — `data.password`,
                            `spec.template.spec.containers[*].env[*].value`.

                            A path that matches nothing in a given object is a silent no-op, which is
                            what makes one policy usable across a whole kind. A path that matches a
                            map or an array rather than a scalar replaces that whole subtree with the
                            sentinel.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-zA-Z_][a-zA-Z0-9_-]*(\[\*\])?(\.[a-zA-Z_][a-zA-Z0-9_-]*(\[\*\])?)*$
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of fieldPath or annotation must be set
                        rule: has(self.fieldPath) != has(self.annotation)
                    maxItems: 64
                    type: array
                type: object
              writer:
                description: Writer sizes the asynchronous write path for this sink.
                properties:
                  batchMaxRows:
                    default: 1000
                    description: |-
                      BatchMaxRows is the row count at which a worker flushes its accumulated
                      insert batch. Row-per-INSERT is ClickHouse's pathological write pattern,
                      so the floor is 1 only to keep the knob honest, never as a recommended
                      value; the ceiling of 100000 bounds the memory one worker can hold and
                      the size of the batch a single failure can poison.
                    format: int32
                    maximum: 100000
                    minimum: 1
                    type: integer
                  batchMaxWait:
                    default: 1s
                    description: |-
                      BatchMaxWait is the longest a batch's first job waits for the batch to
                      fill before it is flushed regardless. It is what keeps a quiet cluster's
                      records from sitting in memory indefinitely behind an unmet row target.
                    type: string
                  checkpointEvery:
                    default: 50
                    description: |-
                      CheckpointEvery is how many consecutive diff-only `Modified` rows this sink
                      accepts for one object before the next one is written as a `Checkpoint` —
                      a row carrying the full state *and* the diff.

                      It is the knob that bounds replay cost. With diffs-only history,
                      reconstructing "state at time T" means replaying every diff back to the
                      object's last full row, which is unbounded for a long-lived object; a
                      Checkpoint every N modifications caps that walk at N diffs (see
                      docs/SCHEMA.md). It is per-sink because the trade — storage for query cost
                      — belongs to whoever owns the ClickHouse instance and its analysts.

                      `0` disables checkpointing entirely for this sink. The ceiling of 10000 is
                      not a technical limit but an honesty one: a cadence beyond it is
                      indistinguishable from disabling the feature while looking like it is on.
                      A single diff that comes out larger than the object it describes is
                      checkpointed regardless of the cadence — unless checkpointing is disabled.
                    format: int32
                    maximum: 10000
                    minimum: 0
                    type: integer
                  drainTimeout:
                    default: 15s
                    description: |-
                      DrainTimeout is the budget for flushing queued writes during graceful
                      shutdown, before the connection is closed and any still-queued job is
                      settled as failed.
                    type: string
                  enqueueTimeout:
                    default: 2s
                    description: |-
                      EnqueueTimeout is how long Enqueue waits for queue room before returning
                      an error. It is a backpressure signal, never a silent drop: the caller
                      propagates the error so the pipeline's own requeue/backoff takes over.
                    type: string
                  queueSize:
                    default: 5000
                    description: |-
                      QueueSize is the capacity, in jobs, of the async hand-off queue between
                      pipeline workers and this sink's writers.
                    format: int32
                    maximum: 1000000
                    minimum: 1
                    type: integer
                  workers:
                    default: 4
                    description: |-
                      Workers is how many goroutines drain the queue into ClickHouse. The
                      upper bound is 64 because ClickHouse punishes high insert concurrency
                      far more than it rewards it — past a few dozen concurrent inserters the
                      server spends its time merging parts, not ingesting.
                    format: int32
                    maximum: 64
                    minimum: 1
                    type: integer
                type: object
            required:
            - connection
            type: object
          status:
            description: status defines the observed state of ClickHouseSink.
            properties:
              conditions:
                description: |-
                  Conditions carries Ready, SchemaValid and CredentialsResolved (see the
                  condition-type constants). All three are set by asynchronous probes:
                  a control-plane reconciler never dials ClickHouse on its own goroutine
                  (Invariant 1), so an unreachable sink slows nothing down — it just
                  reports here.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the metadata.generation this status
                  reflects.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clusterstreamrules.kuberecord.io
spec:
  group: kuberecord.io
  names:
    kind: ClusterStreamRule
    listKind: ClusterStreamRuleList
    plural: clusterstreamrules
    singular: clusterstreamrule
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    - jsonPath: .spec.sink.name
      name: SINK
      type: string
    - jsonPath: .spec.sink.kind
      name: SINK-KIND
      type: string
    - jsonPath: .status.activeWatches
      name: WATCHES
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterStreamRule declares that the resources it names, across the
          namespaces its selector matches, should be streamed to a ClickHouseSink.

          It is cluster-scoped (D6) and is the only rule type permitted to name
          cluster-scoped kinds (Nodes, Namespaces, CRDs …), because doing so requires
          cluster-level authority the namespaced StreamRule deliberately does not
          assume. Its status uses the same StreamRuleStatus shape as StreamRule, so a
          single set of condition semantics covers both.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ClusterStreamRule.
            properties:
              extraRedaction:
                description: |-
                  ExtraRedaction adds value paths to scrub, on top of whatever the target
                  sink's `spec.policy.redaction` already scrubs (Task 3.3).

                  It is strictly additive: a rule can add paths, never remove one the sink's
                  owner configured. Values are scrubbed after normalization and *before*
                  hashing, so a redacted value never reaches ClickHouse — not in `data`, not
                  in a `diff` delta, and not as a hash an attacker could grind. Two objects
                  differing only in a redacted value are indistinguishable to the pipeline
                  and deduplicate away.

                  The paths apply to every resource this rule names. A path matching nothing
                  in a given object is a no-op, so one rule can redact `data.password`
                  across a mixed resource list without splitting into two rules.

                  Redaction is not a way to stream something otherwise forbidden: `v1/Secret`
                  remains denied in code (D8) whether or not a policy would scrub it.
                items:
                  description: |-
                    RedactionRule names one value to scrub out of every streamed object before it
                    is hashed, diffed and written (Task 3.3).

                    Exactly one of the two fields is set. They are separate fields rather than one
                    string with two grammars because an annotation key routinely contains dots and
                    slashes — `kubectl.kubernetes.io/last-applied-configuration` — which the
                    dot-segment path syntax cannot spell unambiguously: written as a `fieldPath`
                    it would mean six nested maps that do not exist. The shorthand is therefore
                    the only way to name such a key, not sugar over a longer form.

                    Redaction is *additive* everywhere it appears. A sink's policy is the floor,
                    a rule's `extraRedaction` adds to it, and rules that overlap on one target
                    contribute a union — nothing anywhere can remove a path another party asked
                    for. That is what lets a platform team hand out a sink whose redaction floor
                    they own without reviewing every rule written against it.
                  properties:
                    annotation:
                      description: |-
                        Annotation is the shorthand for one annotation key, equivalent to a
                        fieldPath of `metadata.annotations` indexed by this exact key.

                        `kubectl.kubernetes.io/last-applied-configuration` never needs listing: it
                        is scrubbed on every object under every policy, including an empty one,
                        because kubectl copies the entire submitted object into it and it would
                        otherwise re-leak every value the rest of the policy removes.
                      maxLength: 253
                      minLength: 1
                      pattern: ^([a-z0-9]([-a-z0-9.]*[a-z0-9])?/)?[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$
                      type: string
                    fieldPath:
                      description: |-
                        FieldPath is the value to scrub, as dot-separated field names with an
                        optional `[*]` wildcard over arrays — `data.password`,
                        `spec.template.spec.containers[*].env[*].value`.

                        A path that matches nothing in a given object is a silent no-op, which is
                        what makes one policy usable across a whole kind. A path that matches a
                        map or an array rather than a scalar replaces that whole subtree with the
                        sentinel.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-zA-Z_][a-zA-Z0-9_-]*(\[\*\])?(\.[a-zA-Z_][a-zA-Z0-9_-]*(\[\*\])?)*$
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of fieldPath or annotation must be set
                    rule: has(self.fieldPath) != has(self.annotation)
                maxItems: 64
                type: array
              namespaceSelector:
                description: |-
                  NamespaceSelector chooses the namespaces this rule applies to. Nil means
                  every namespace, including namespaces created after the rule.

                  It selects on *namespace* labels, not object labels — use
                  resources[].labelSelector for the latter. A selector matching no
                  namespace is legal and leaves the rule Ready with activeWatches=0; it is
                  a normal transient state while the namespaces that will match are still
                  being created.

                  Cluster-scoped kinds named by this rule ignore the selector entirely:
                  they have no namespace to select on. ClusterStreamRule is the only type
                  permitted to name them.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              resources:
                description: |-
                  Resources are the resource types this rule streams. At least one is
                  required — an empty rule is always an authoring mistake, and rejecting it
                  at admission is far kinder than a rule that reconciles green while
                  streaming nothing.

                  Kubernetes Events (`v1/Event` or `events.k8s.io/v1/Event`, whichever you
                  name) are streamed in a built-in Events mode, because an Event is
                  append-only ephemera rather than durable cluster state. Naming one is the
                  only thing you do — there is no switch, and no way to opt out, since every
                  difference exists to stop kuberecord recording something untrue:

                    - every row carries the full Event, never a diff, so a count bump is
                      readable on its own;
                    - an Event's ~1h TTL expiry is recorded as nothing at all, never as a
                      Deleted row;
                    - watch scopes still open and close normally, and a restart still
                      deduplicates against already-recorded Events.

                  See docs/SCHEMA.md ("Kubernetes Events") and docs/QUERIES.md.
                items:
                  description: |-
                    WatchedResource names one resource type a rule wants streamed.

                    It is a (group, version, kind) triple plus an optional label selector rather
                    than a plural resource name because the CRD is authored by humans against
                    the same vocabulary they read in `kubectl explain` and YAML `apiVersion` /
                    `kind` fields; the plural GVR is derived by the REST mapper (Task 1.3), which
                    is also where an unknown kind is detected and parked.
                  properties:
                    group:
                      default: ""
                      description: |-
                        Group is the API group, e.g. "apps" or "networking.k8s.io". Empty means
                        the core group (`v1/Pod`). Must be empty or a DNS-1123 subdomain.
                      maxLength: 253
                      pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    kind:
                      description: |-
                        Kind is the resource Kind in upper camel case, e.g. "Deployment" — not
                        the plural resource name ("deployments").
                      maxLength: 63
                      pattern: ^[A-Z][A-Za-z0-9]{0,62}$
                      type: string
                    labelSelector:
                      description: |-
                        LabelSelector optionally narrows the rule to objects carrying matching
                        labels. Nil selects every object of this kind in scope.

                        Selectors are applied by the event handler, not by the informer's
                        ListWatch: one informer per (GVR, namespace) is shared by every rule and
                        sink interested in that target, so changing a selector re-filters events
                        without tearing down and re-listing a watch (Task 1.4). The trade-off is
                        deliberate — informer bandwidth in exchange for a pool that never
                        thrashes on a selector edit.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array

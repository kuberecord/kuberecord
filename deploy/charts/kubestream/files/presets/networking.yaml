# Watch preset: networking. Not installed by default — apply it to stream
# Ingresses, NetworkPolicies and the endpoint objects behind Services.
#
# `get,list,watch` only, and never `secrets` (D8) — see presets/core-workloads.yaml
# and docs/RBAC.md for why.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubestream
    app.kubernetes.io/managed-by: kustomize
    kubestream.io/aggregate-to-watcher: "true"
  name: watcher-networking
rules:
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  - ingressclasses
  - networkpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - endpoints
  verbs:
  - get
  - list
  - watch

{{- if and .Values.rbac.create .Values.metrics.enabled }}
# Authn/authz for the metrics endpoint: the operator itself must be able to
# review the tokens and subjects of whoever scrapes it. Rendered only with
# metrics enabled — with no endpoint there is nothing to protect.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubestream.fullname" . }}-metrics-auth-role
  labels:
    {{- include "kubestream.labels" . | nindent 4 }}
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubestream.fullname" . }}-metrics-auth-rolebinding
  labels:
    {{- include "kubestream.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubestream.fullname" . }}-metrics-auth-role
subjects:
- kind: ServiceAccount
  name: {{ include "kubestream.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# Granted to *scrapers*, not to the operator: bind it to whichever
# ServiceAccount your Prometheus runs as. It is shipped unbound on purpose —
# handing out read access to the metrics is a decision for whoever installs the
# chart, not a side effect of installing it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubestream.fullname" . }}-metrics-reader
  labels:
    {{- include "kubestream.labels" . | nindent 4 }}
rules:
- nonResourceURLs:
  - "/metrics"
  verbs:
  - get
{{- end }}

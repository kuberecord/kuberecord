apiVersion: v2
name: kuberecord
description: |
  Kubernetes-native operator that streams cluster state changes to ClickHouse
  and to S3-compatible object storage for audit, GitOps forensics and change
  intelligence.
type: application
# version is the chart's own version; appVersion is the operator release it
# installs by default (values.yaml leaves image.tag empty so it follows this
# field). Both must move together with the Makefile's VERSION.
version: 0.3.1
appVersion: "v0.3.1"
# The chart installs no webhooks and no cert-manager (D4): validation is entirely
# CRD structural schemas plus CEL (x-kubernetes-validations), which is why the
# floor is 1.29 — the release where CEL validation cost budgets and
# `x-kubernetes-validations` on all schema nodes are generally available.
kubeVersion: ">= 1.29.0-0"
home: https://github.com/kuberecord/kuberecord
sources:
  - https://github.com/kuberecord/kuberecord
keywords:
  - kubernetes
  - audit
  - clickhouse
  - s3
  - observability
  - gitops
annotations:
  # The CRDs live in crds/ per Helm convention, which means Helm installs them
  # but never upgrades or deletes them. Declared here so the constraint is
  # visible to anyone reading the chart metadata rather than only its README.
  kuberecord.io/crd-lifecycle: install-only
# Chart maintainers, surfaced on the Artifact Hub listing next to the ownership
# claim in the repository's artifacthub-repo.yml. Kept in step with that file:
# Helm shows this list, Artifact Hub trusts that one, and a reader who finds
# them disagreeing has no way to tell which is current.
maintainers:
  - name: Yelyzaveta Zhyrova
    email: zhyrova.yelyzaveta@gmail.com

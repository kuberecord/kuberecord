# Watch preset: Kubernetes Events.
#
# Both APIs, because a rule may name either `v1/Event` or
# `events.k8s.io/v1/Event` and they are two resources over one storage: granting
# only one would leave the other spelling degraded with RBACGranted=False for no
# reason an author could guess from the cluster.
#
# Events are streamed in the built-in Events mode (full state per row, no Deleted
# rows for TTL expiry) — see docs/SCHEMA.md. That is a property of the kind, not
# of this grant; this file only decides whether the operator may read them at all.
#
# Not enabled by default. Events are by far the highest-volume kind in a cluster,
# so the storage bill belongs to somebody who asked for it.
#
# `get,list,watch` only, and never `secrets` (D8) — see presets/core-workloads.yaml
# and docs/RBAC.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kuberecord
    app.kubernetes.io/managed-by: kustomize
    kuberecord.io/aggregate-to-watcher: "true"
  name: watcher-events
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - get
  - list
  - watch

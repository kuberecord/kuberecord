# Sample alert rules for kuberecord, as a prometheus-operator PrometheusRule.
#
#   kubectl apply -f deploy/prometheus/alerts.yaml
#
# The `release: kube-prometheus-stack` label is what the stock kube-prometheus-stack
# Prometheus selects rules on; change it to match your own `ruleSelector` if you run
# a different install. Everything under .spec is an ordinary Prometheus rule file, so
# a Prometheus that is not managed by the operator can consume the same four rules by
# lifting .spec into a file listed under `rule_files:`.
#
# These are a starting point, not a policy. The thresholds below are argued from how
# the operator behaves — each one is explained above its rule — but the right `for`
# duration depends on how much staleness your audit trail can absorb, and the right
# severity depends on who is on call for it.
#
# Every alert is paired with a panel on deploy/grafana/operator-health.json, and the
# runbook_url annotations point at the section of docs/OPERATING.md that says what to
# do next.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kuberecord-operator
  labels:
    app.kubernetes.io/name: kuberecord
    app.kubernetes.io/component: alerts
    release: kube-prometheus-stack
spec:
  groups:
    - name: kuberecord.operator
      # 30s matches the dashboard's refresh and is well inside the shortest `for`
      # below, so no alert's clock is quantized by the evaluation interval.
      interval: 30s
      rules:
        # Why 80%: the hand-off queue is a shock absorber, and filling it briefly is
        # the design working — an informer resync or a mass rollout hands the
        # pipeline thousands of objects at once. Sustained occupancy above 80% is a
        # different statement: the drain rate is below the arrival rate, and the
        # remaining fifth of the queue is minutes of headroom, not hours. Below 80%
        # the queue still absorbs a burst; above it, the next burst blocks the hot
        # path.
        #
        # Why 5m: long enough that a resync burst (which drains in seconds) never
        # pages, short enough that an operator still has queue headroom left to act
        # within when it does.
        #
        # The `and capacity > 0` guard is not decoration. A sink whose capacity gauge
        # has not been published yet would make the division +Inf, which satisfies
        # any threshold — the alert would fire on a sink that has never accepted a
        # single write.
        - alert: KuberecordWriteQueueSaturated
          expr: |
            (
              kuberecord_write_queue_depth / kuberecord_write_queue_capacity > 0.8
            )
            and kuberecord_write_queue_capacity > 0
          for: 5m
          labels:
            severity: warning
            component: kuberecord
          annotations:
            summary: kuberecord sink {{ $labels.sink }} write queue is over 80% full
            description: >-
              The hand-off queue for sink {{ $labels.sink }} has been over 80% full for
              5 minutes ({{ $value | humanizePercentage }} now). ClickHouse is draining
              slower than the cluster is changing. Check write latency and the retry
              rate on the operator-health dashboard; if the backend is healthy, raise
              spec.writer.workers or spec.writer.queueSize on the ClickHouseSink.
            runbook_url: https://github.com/yelzhy/kuberecord/blob/main/docs/OPERATING.md#queue-saturation

        # Why > 0: a failed write is not a retry — the writer has already exhausted
        # its per-job retry budget by the time the job settles as failed, and the row
        # it carried never reaches ClickHouse. There is no acceptable nonzero rate of
        # that, so the threshold is zero and the only tunable is how long to wait.
        #
        # Why 10m: the writer's own backoff absorbs a ClickHouse restart or a brief
        # network partition without any write settling as failed at all. A failure
        # rate that is still nonzero ten minutes later has outlived that budget and is
        # not going to resolve on its own. Alerting on the first failed write would
        # page for every routine ClickHouse upgrade.
        - alert: KuberecordWriteFailures
          expr: sum by (sink) (rate(kuberecord_writes_total{outcome="failed"}[5m])) > 0
          for: 10m
          labels:
            severity: critical
            component: kuberecord
          annotations:
            summary: kuberecord sink {{ $labels.sink }} is losing writes
            description: >-
              Writes to sink {{ $labels.sink }} have been settling as failed for 10
              minutes ({{ $value | printf "%.2f" }}/s). Each one exhausted its retry
              budget, so those rows are not in ClickHouse and the audit trail has gaps.
              Check the ClickHouseSink's Ready condition and the operator logs.
            runbook_url: https://github.com/yelzhy/kuberecord/blob/main/docs/OPERATING.md#failed-writes

        # Why > 0: a rule that is not Ready is not streaming what its author asked
        # for, and by design the operator degrades that one rule rather than
        # crash-looping — so nothing else will ever draw attention to it. One is too
        # many.
        #
        # Why 15m: a rule is legitimately Ready=False for a while during ordinary
        # sequencing — a rule applied before its sink, a CRD whose kind is not
        # installed yet, an RBAC preset applied a minute later. Every one of those
        # self-heals on the reconciler's 2-minute resync, so 15m gives a rule roughly
        # seven chances to recover on its own before anyone is told about it.
        #
        # No aggregation: the series carries only (condition, status), so the raw
        # comparison keeps whatever job/instance labels the scrape added, and an
        # operator running two replicas sees which one is reporting.
        - alert: KuberecordRuleNotReady
          expr: kuberecord_rules{condition="Ready",status="false"} > 0
          for: 15m
          labels:
            severity: warning
            component: kuberecord
          annotations:
            summary: '{{ $value }} kuberecord rule(s) have been not-Ready for 15 minutes'
            description: >-
              {{ $value }} StreamRule(s) or ClusterStreamRule(s) report Ready=False and
              have not recovered across several resyncs. Run
              `kubectl get streamrules,clusterstreamrules -A` and read the conditions
              on the ones that are not Ready — the usual causes are a missing RBAC
              preset, a kind that does not resolve, or a sink policy denial.
            runbook_url: https://github.com/yelzhy/kuberecord/blob/main/docs/OPERATING.md#rules-not-ready

        # Why > 0: an enqueue timeout means the queue stayed full for the whole
        # enqueue timeout and the pipeline gave up handing that item over. Nothing is
        # lost — the item goes back on the workqueue and the informer cache still
        # holds the object — but the pipeline has stopped keeping up, and every
        # requeue adds to how stale the audit trail is. Zero is the only healthy rate.
        #
        # Why 5m, i.e. sooner than the failed-write alert: this fires on backpressure
        # that is still recoverable, while KuberecordWriteFailures fires on data that
        # is already gone. Catching the first is how you avoid the second. It is
        # deliberately the same window as the queue-saturation alert, which is its
        # precursor: seeing both is the unambiguous signal that the sink is
        # undersized rather than briefly slow.
        - alert: KuberecordEnqueueTimeouts
          expr: sum by (sink) (rate(kuberecord_enqueue_timeouts_total[5m])) > 0
          for: 5m
          labels:
            severity: critical
            component: kuberecord
          annotations:
            summary: kuberecord sink {{ $labels.sink }} is shedding work under backpressure
            description: >-
              Enqueues to sink {{ $labels.sink }} have been timing out for 5 minutes
              ({{ $value | printf "%.2f" }}/s). The write queue is staying full, so
              pipeline workers are requeueing instead of making progress and the data
              in ClickHouse is falling behind the cluster. Treat this as the escalation
              of KuberecordWriteQueueSaturated.
            runbook_url: https://github.com/yelzhy/kuberecord/blob/main/docs/OPERATING.md#enqueue-timeouts

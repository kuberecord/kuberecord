version: "2"
run:
  allow-parallel-runners: true
  # Without this the tagged acceptance suites are invisible to the linter — and to
  # `go vet`, which `make build`/`make test` run over the default build only. The
  # e2e suite is the Phase 1 gate (Task 1.11), the chaos suite is the Phase 2
  # failure-mode gate (Task 2.1), and the integration suites are what prove each
  # backend against a real server rather than a fake (Task 3.2 for ClickHouse's
  # published queries, Task 6.6 for the S3 writer against MinIO). "make lint
  # passes" has to mean something for all three.
  build-tags:
    - e2e
    - chaos
    - integration
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    depguard:
      rules:
        # Task 0.5 established this as a denylist over the data and control
        # planes: the code that hands records to a sink must depend on the
        # generic sink contract (internal/sink), never on the ClickHouse driver
        # directly, and per Invariant 1 a reconciler must never dial ClickHouse
        # at all. Task 9.3 turns it into what it was always trying to be — a
        # confinement. Two packages hold the driver, one per plane, and the rule
        # now says so by listing everything under internal/ and excepting them,
        # rather than by naming the three directories somebody happened to think
        # of. A new internal package can no longer acquire the driver silently.
        #
        # `!` entries are exceptions, and each one is load-bearing:
        # internal/sink/clickhouse is the write path (Task 0.5) and
        # internal/query/clickhouse is the read path (Task 9.3). Nothing else is
        # excepted, and adding a third exception is the review conversation this
        # shape exists to force.
        #
        # The scope is internal/ deliberately. test/queries and test/loadgen dial
        # a real dockerized server on purpose — that is what an integration
        # harness is — and denying the driver there would be denying those suites
        # their subject. Source and test files alike within internal/.
        clickhouse-driver-is-confined:
          files:
            - "**/internal/**"
            - "!**/internal/sink/clickhouse/**"
            - "!**/internal/query/clickhouse/**"
          deny:
            - pkg: github.com/ClickHouse/clickhouse-go/v2
              desc: "the ClickHouse driver belongs to internal/sink/clickhouse (the write path, Task 0.5) and internal/query/clickhouse (the read path, Task 9.3) alone; everything else speaks internal/sink or internal/query"

        # Task 6.4: the object-store client is confined to the one package that
        # exists to hold it (internal/sink/s3/awsstore). The control plane and the
        # data plane must not reach an SDK — Invariant 1 is what says a reconciler
        # cannot dial a backend, and the S3 reconciler's configuration builder is
        # injected from the wiring precisely so that this stays a property of the
        # import graph rather than of the control flow. internal/sink/s3 itself is
        # listed because the write path is tested against a stand-in object store,
        # not a mocked HTTP client, and an SDK import there would quietly make that
        # untrue (see internal/sink/s3/client.go).
        object-store-client-is-confined:
          files:
            - "**/internal/pipeline/**"
            - "**/internal/controller/**"
            - "**/internal/watch/**"
            - "**/internal/sink/*.go"
            - "**/internal/sink/clickhouse/**"
            - "**/internal/sink/conformance/**"
            # Non-recursive on purpose — `*.go`, never `**`. That single character
            # *is* the confinement boundary: the glob covers internal/sink/s3's own
            # files and deliberately does not descend into internal/sink/s3/awsstore,
            # which is the one package allowed to hold the SDK. Widening it to `/**`
            # would deny the SDK inside the package whose entire purpose is to
            # contain it, so the rule cannot simply be made "stricter" here.
            - "**/internal/sink/s3/*.go"
          deny:
            - pkg: github.com/aws/aws-sdk-go-v2
              desc: "the AWS SDK belongs to internal/sink/s3/awsstore alone; everything else speaks the s3.ObjectStore interface (Task 6.4)"
            - pkg: github.com/aws/smithy-go
              desc: "smithy-go is the AWS SDK's error and transport substrate (smithy.APIError, smithy.OperationError); it belongs to internal/sink/s3/awsstore for exactly the reason the SDK itself does — a Prober that classified NoSuchBucket by unwrapping smithy types would put SDK types back into the package whose purpose is to be SDK-free (Task 6.4)"
            - pkg: github.com/aws/aws-sdk-go
              desc: "kuberecord is aws-sdk-go-v2 only: a v1 import would be both an isolation break and a dependency regression, so v1 is a tombstone here rather than an omission (Task 6.7)"

        # Task 9.2 acceptance criterion: the query conformance suite is built
        # around the read-plane contract in internal/query, not around any
        # backend's implementation of it. internal/sink is denied for a reason
        # distinct from the rest: it is not merely the write path, it has a read
        # half of its own, and a suite able to see it would be tempted to measure
        # a query backend against the operator's own reader — two contracts with
        # opposite pressures, one of which sits on the hot path's dependency
        # graph (D16). The query backends are listed as tombstones ahead of
        # existing (Tasks 9.3 and 10.2), because a suite that quietly certified
        # one backend against another's behaviour would gate nothing (D11).
        query-conformance-suite-is-backend-agnostic:
          files:
            - "**/internal/query/conformance/**"
          deny:
            - pkg: github.com/kuberecord/kuberecord/internal/sink
              desc: "the query conformance suite must depend only on the read-plane contract; the sink's own reader serves the operator's warm-up and GC needs and is a different contract (D16, Task 9.2)"
            - pkg: github.com/kuberecord/kuberecord/internal/pipeline
              desc: "the query conformance suite is a client of the frozen schema, not of the operator's runtime (D20, Task 9.2)"
            - pkg: github.com/kuberecord/kuberecord/internal/query/clickhouse
              desc: "the query conformance suite must name no backend: it is the contract every query backend is measured against (Task 9.2)"
            - pkg: github.com/kuberecord/kuberecord/internal/query/objectsource
              desc: "the query conformance suite must name no backend: it is the contract every query backend is measured against (Task 9.2)"
            - pkg: github.com/ClickHouse/clickhouse-go/v2
              desc: "the query conformance suite must name no backend: it is the contract every query backend is measured against (Task 9.2)"

        # Task 5.1 acceptance criterion: the Writer conformance suite is built
        # around the contract in internal/sink, not around any backend's
        # implementation of it. internal/pipeline is denied because it imports
        # internal/sink (so the dependency can only run one way, and a test
        # binary reaching back would be an import cycle waiting to happen), and
        # the ClickHouse packages because a suite that quietly certified one
        # backend against another's behaviour would gate nothing (D11).
        conformance-suite-is-backend-agnostic:
          files:
            - "**/internal/sink/conformance/**"
          deny:
            - pkg: github.com/kuberecord/kuberecord/internal/pipeline
              desc: "the conformance suite must depend only on the sink contract; internal/sink cannot import internal/pipeline (Task 5.1)"
            - pkg: github.com/kuberecord/kuberecord/internal/sink/clickhouse
              desc: "the conformance suite must name no backend: it is the contract every backend is measured against (Task 5.1)"
            - pkg: github.com/ClickHouse/clickhouse-go/v2
              desc: "the conformance suite must name no backend: it is the contract every backend is measured against (Task 5.1)"
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
